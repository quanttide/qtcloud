# 发布 lite 微信小程序：推送 lite tag（如 lite/v1.0.0）时，
# 构建 Taro 产物并用 miniprogram-ci 上传体验版，随后在微信公众平台「版本管理」验收。
#
# 触发说明：
#   lite/v* 与 v*.*.* 两种 tag 均可触发；日常 push 不触发，避免污染开发版本列表。
#   亦可在 Actions 页面手动触发（可指定版本号，缺省回退 package.json 版本）。
#
# 版本号取 tag 最后一段并去掉 v 前缀（lite/v1.0.0 → 1.0.0），保证与代码版本一一对应。
#
# 所需 GitHub secrets（仓库级）：
#   - MINIPROGRAM_PRIVATE_KEY：小程序代码上传密钥文件全文（公众平台「开发设置」下载）
#   - MINIPROGRAM_APPID：小程序 AppID
#   - MINIPROGRAM_ROBOT：机器人编号 1-30（可选，默认 1，不同编号互不覆盖）
# 若公众平台开启了 IP 白名单，需关闭或加入 GitHub Actions 出口 IP（出口 IP 不固定，建议关闭）。

name: Deploy Lite

on:
  push:
    tags:
      - 'lite/v*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '上传版本号 x.y.z，留空时按 tag 或 package.json 推断'
        required: false

concurrency:
  group: deploy-lite
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build Taro & Upload MiniProgram
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/lite/package-lock.json

      - name: Install & Build
        working-directory: src/lite
        # 锁文件在 npmmirror 下生成，CI 改用 npmjs 拉取，避免依赖国内镜像的可达性
        run: |
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
          npm run build:weapp

      - name: Upload to WeChat
        working-directory: src/lite
        env:
          MINIPROGRAM_PRIVATE_KEY: ${{ secrets.MINIPROGRAM_PRIVATE_KEY }}
          MINIPROGRAM_APPID: ${{ secrets.MINIPROGRAM_APPID }}
          MINIPROGRAM_ROBOT: ${{ secrets.MINIPROGRAM_ROBOT }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: node scripts/upload.js

  # 基础设施：远端状态 + plan + apply，只 -target 本 lite 的站点资源——
  # 本 root 与站点/工作室共用一份状态，全量 apply 会被无关资源的失败牵连。
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_VAR_region: cn-hangzhou
      TF_STATE_BUCKET: quanttide-terraform-state
      TF_STATE_KEY: qtcloud/terraform.tfstate
      ALICLOUD_ACCESS_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      ALICLOUD_SECRET_KEY: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
      ALICLOUD_REGION_ID: cn-hangzhou
      TF_LITE_TARGETS: >-
        -target=alicloud_oss_bucket.lite
        -target=alicloud_oss_bucket_public_access_block.lite
        -target=alicloud_oss_bucket_acl.lite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Terraform Init
        working-directory: manifests/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.TF_VAR_region }}"

      - name: Terraform Validate
        working-directory: manifests/terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        working-directory: manifests/terraform
        run: terraform plan -input=false -no-color ${{ env.TF_LITE_TARGETS }} -out=tfplan

      - name: Terraform Apply
        working-directory: manifests/terraform
        run: terraform apply -input=false -no-color tfplan

  # 网页版：lite.cloud.quanttide.com（与小程序上传并行，互不依赖）
  # 产物是 Taro h5（dist-h5/），文件名不带内容哈希，所以整站 no-cache——
  # 否则发版后浏览器/CDN 拿旧 JS。
  deploy-web:
    name: Build H5 & Deploy to OSS
    needs: terraform
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: qtcloud-lite
      OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
      CDN_DOMAIN: lite.cloud.quanttide.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/lite/package-lock.json

      - name: Install & Build H5
        working-directory: src/lite
        # 锁文件在 npmmirror 下生成，CI 改用 npmjs 拉取，避免依赖国内镜像的可达性
        run: |
          npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
          npm run build:h5

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ env.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Upload H5 to OSS（no-cache）
        working-directory: src/lite
        run: ossutil cp dist-h5/ oss://${{ env.OSS_BUCKET }}/ -r -f --meta "Cache-Control:no-cache"

      - name: Refresh CDN
        run: |
          pip install aliyun-python-sdk-cdn
          python -c "
          from aliyunsdkcore.client import AcsClient
          from aliyunsdkcdn.request.v20180510.RefreshObjectCachesRequest import RefreshObjectCachesRequest
          import os
          cli = AcsClient(os.environ['ALIYUN_ACCESS_KEY_ID'], os.environ['ALIYUN_ACCESS_KEY_SECRET'], 'cn-hangzhou')
          req = RefreshObjectCachesRequest()
          req.set_ObjectPath('https://${{ env.CDN_DOMAIN }}/')
          req.set_ObjectType('Directory')
          cli.do_action_with_exception(req)
          "
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
